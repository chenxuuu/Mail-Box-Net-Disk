name: build

on:
  push:
    paths:
      - 'maildisk/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'maildisk/**'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: environment prepare
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
      - name: build
        run: |
          cd maildisk/src/MailDisk
          dotnet publish -r win-x86 -p:PublishSingleFile=true -p:PublishTrimmed=true --self-contained true
          dotnet publish -r win-x64 -p:PublishSingleFile=true -p:PublishTrimmed=true --self-contained true
          dotnet publish -r win-arm64 -p:PublishSingleFile=true -p:PublishTrimmed=true --self-contained true
          dotnet publish -r linux-x64 -p:PublishSingleFile=true -p:PublishTrimmed=true --self-contained true
          dotnet publish -r linux-arm64 -p:PublishSingleFile=true -p:PublishTrimmed=true --self-contained true
          dotnet publish -r osx-x64 -p:PublishSingleFile=true -p:PublishTrimmed=true --self-contained true
          dotnet publish -r osx-arm64 -p:PublishSingleFile=true -p:PublishTrimmed=true --self-contained true
      - name: create packages
        run: |
          mkdir maildisk-pkg
          PUB=maildisk/src/MailDisk/bin/Release/net10.0
          mv $PUB/win-x86/publish/* maildisk-pkg/
          7z a win-x86.7z maildisk-pkg/*
          rm maildisk-pkg/*
          mv $PUB/win-x64/publish/* maildisk-pkg/
          7z a win-x64.7z maildisk-pkg/*
          rm maildisk-pkg/*
          mv $PUB/win-arm64/publish/* maildisk-pkg/
          7z a win-arm64.7z maildisk-pkg/*
          rm maildisk-pkg/*
          mv $PUB/linux-x64/publish/* maildisk-pkg/
          7z a linux-x64.7z maildisk-pkg/*
          rm maildisk-pkg/*
          mv $PUB/linux-arm64/publish/* maildisk-pkg/
          7z a linux-arm64.7z maildisk-pkg/*
          rm maildisk-pkg/*
          mv $PUB/osx-x64/publish/* maildisk-pkg/
          7z a osx-x64.7z maildisk-pkg/*
          rm maildisk-pkg/*
          mv $PUB/osx-arm64/publish/* maildisk-pkg/
          7z a osx-arm64.7z maildisk-pkg/*
      - uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: |
            win-x86.7z
            win-x64.7z
            win-arm64.7z
            linux-x64.7z
            linux-arm64.7z
            osx-x64.7z
            osx-arm64.7z
